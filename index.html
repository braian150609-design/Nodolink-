<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NODO Ventas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --ink:#10151F; --ink-soft:#4A5670; --ink-faint:#7C8AA8;
    --paper:#F2F6FD; --surface:#FFFFFF; --surface-2:#EAF1FC;
    --line:#D6E3F7;
    --brand:#77BAFF; --brand-strong:#2E6FC9; --brand-wash:#E4EFFD;
    --gold:#E9A227; --gold-strong:#B97C0E; --gold-wash:#FCEFD6;
    --danger:#D1495B; --danger-wash:#FBE4E7;
    --success:#2F9E6B; --success-wash:#E2F5EC;
    --outline:#10151F;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(16,21,31,.06), 0 1px 1px rgba(16,21,31,.04);
    /* Fixed brand constants — the exact blue from the NODO mark, on purpose
       the same in both themes (like ink on the physical logo). */
    --logo-blue:#77BAFF; --logo-blue-rgb:119,186,255;
    --logo-gold-rgb:233,162,39;
    --logo-ink:#0B1220;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EAF1FF; --ink-soft:#A9B7D6; --ink-faint:#7484A8;
      --paper:#000000; --surface:#0D1117; --surface-2:#141B26;
      --line:#26314C;
      --brand:#8FC4FF; --brand-strong:#5FA0EE; --brand-wash:#152337;
      --gold:#FFC65C; --gold-strong:#E2A53A; --gold-wash:#332510;
      --danger:#F0808F; --danger-wash:#3A1A20;
      --success:#6FD3A3; --success-wash:#123023;
      --outline:#8FC4FF;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EAF1FF; --ink-soft:#A9B7D6; --ink-faint:#7484A8;
    --paper:#000000; --surface:#0D1117; --surface-2:#141B26;
    --line:#26314C;
    --brand:#8FC4FF; --brand-strong:#5FA0EE; --brand-wash:#152337;
    --gold:#FFC65C; --gold-strong:#E2A53A; --gold-wash:#332510;
    --danger:#F0808F; --danger-wash:#3A1A20;
    --success:#6FD3A3; --success-wash:#123023;
    --outline:#8FC4FF;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
  html, body{ overflow-x:hidden; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Manrope', ui-sans-serif, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  h1,h2,h3,.display{ font-family:'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing:.2px; text-wrap:balance; }
  #app{ position:relative; z-index:1; min-height:100vh; opacity:1; transform:scale(1) translateY(0); transition:opacity .2s ease, transform .2s ease; }
  #app.app-leave{ opacity:0; transform:scale(.98) translateY(8px); }
  @media (prefers-reduced-motion: reduce){ #app{ transition:none !important; } }
  .page{ max-width:1080px; margin:0 auto; padding:22px 16px 90px; position:relative; z-index:1; }
  #bg-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  a{ color:inherit; }
  button{ font-family:inherit; touch-action:manipulation; }
  input, select, textarea{ font-family:inherit; font-size:16px; touch-action:manipulation; }
  .btn, .ghost-btn, .tab-btn, .choice-card, .promotor-pick, .promotor-card, .card, .rank-row, .leader-card{ touch-action:manipulation; }
  /* Tap feedback for touch devices (no real ':hover' on a touchscreen) */
  .btn:active{ transform:translateY(2px); box-shadow:1px 1px 0 var(--outline); }
  .ghost-btn:active{ background:var(--surface-2); }
  .tab-btn:active{ filter:brightness(.96); }
  .choice-card:active{ transform:translate(-1px,-1px); box-shadow:2px 3px 0 var(--outline); }
  .card:active, .promotor-card:active, .promotor-pick:active{ transform:translateY(-1px); box-shadow:0 4px 10px rgba(11,18,32,.1), var(--shadow-sm); }
  @media (prefers-reduced-motion: reduce){
    .btn:active, .choice-card:active, .card:active, .promotor-card:active, .promotor-pick:active{ transform:none; }
  }

  .num{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; }

  /* ---------- Layout bits ---------- */
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ justify-content:space-between; }
  .wrap{ flex-wrap:wrap; }
  .grid{ display:grid; gap:14px; }
  .grid-stats{ grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); }
  .muted{ color:var(--ink-soft); }
  .faint{ color:var(--ink-faint); }
  .small{ font-size:.82rem; }
  .center{ text-align:center; }
  .hidden{ display:none !important; }

  /* ---------- Header / brand ---------- */
  /* Deliberately single-look: the exact logo blue + near-black, fixed in
     both themes, like a letterhead band carrying the mark's own colors. */
  .topbar-full{ background:var(--logo-blue); border-bottom:3px solid var(--logo-ink); position:relative; }
  .topbar-inner{ max-width:1080px; margin:0 auto; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; position:relative; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ width:34px; height:34px; display:block; }
  .brand .badge-bg{ width:38px; height:38px; border-radius:11px; background:#fff; display:flex; align-items:center; justify-content:center; border:2.5px solid var(--logo-ink); box-shadow:2px 2px 0 var(--logo-ink); animation: floaty 3.6s ease-in-out infinite; }
  .brand .badge-bg img{ width:25px; height:25px; }
  .brand-name{ font-family:'Plus Jakarta Sans'; font-weight:800; font-size:1.35rem; letter-spacing:.2px; color:var(--logo-ink); }
  .topbar-full .chip, .topbar-full .ghost-btn{ background:rgba(11,18,32,.08); border-color:rgba(11,18,32,.35); color:var(--logo-ink); }
  .topbar-full .ghost-btn:hover{ border-color:var(--logo-ink); color:var(--logo-ink); background:rgba(11,18,32,.14); }

  .ghost-btn{ display:inline-flex; align-items:center; gap:5px; background:transparent; border:1.5px solid var(--line); color:var(--ink-soft); border-radius:10px; padding:.5rem .8rem; font-weight:700; font-size:.85rem; cursor:pointer; white-space:nowrap; }
  .ghost-btn:hover{ border-color:var(--brand-strong); color:var(--brand-strong); }

  /* ---------- Sticker buttons / cards (brand motif from the logo outline) ---------- */
  .btn{ position:relative; overflow:hidden; border-radius:12px; border:2px solid var(--outline); font-weight:800; padding:.72rem 1.15rem; cursor:pointer; box-shadow:3px 3px 0 var(--outline); transition:transform .08s ease, box-shadow .08s ease; }
  .btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--outline); }
  .btn::after{
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.55), transparent);
    transform:skewX(-20deg); animation:shimmer 3.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .btn::after{ animation:none; display:none; } }
  .btn-primary{ background:var(--brand-strong); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-gold{ background:var(--gold); color:#241a00; }
  .btn-line{ background:var(--surface); color:var(--ink); }
  .btn-danger{ background:var(--surface); color:var(--danger); border-color:var(--danger); box-shadow:3px 3px 0 var(--danger); }
  .btn-sm{ padding:.42rem .7rem; font-size:.8rem; border-radius:9px; box-shadow:2px 2px 0 var(--outline); }
  .btn-sm:active{ box-shadow:1px 1px 0 var(--outline); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-block{ width:100%; }

  .card{ background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:18px; }
  .card-sticker{ border:2.5px solid var(--outline); box-shadow:4px 4px 0 var(--outline); border-radius:16px; }

  /* ---------- Gate ---------- */
  .gate-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:20px 0; }
  .gate-card{ max-width:460px; width:100%; text-align:center; }
  .gate-mascot{ width:96px; height:96px; margin:0 auto 6px; }
  .gate-title{ font-size:1.7rem; font-weight:800; margin:6px 0 2px; }
  .gate-sub{ color:var(--ink-soft); margin-bottom:22px; font-size:.95rem; }
  .choice-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .choice-grid{ grid-template-columns:1fr; } }
  .choice-card{ background:rgba(var(--logo-blue-rgb),.13); border:2.5px solid var(--outline); border-radius:14px; padding:22px 14px; cursor:pointer; text-align:center; transition:border-color .1s, transform .1s, box-shadow .1s; box-shadow:3px 3px 0 var(--outline); }
  .choice-card:hover{ transform:translate(-1px,-3px); box-shadow:5px 6px 0 var(--outline); }
  .choice-card .icon{ display:block; margin:0 auto 10px; color:var(--brand-strong); }
  .choice-card .lbl{ font-weight:800; }
  .promotor-pick-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-top:6px; }
  .promotor-pick{ background:rgba(var(--logo-blue-rgb),.13); border:2px solid var(--line); border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer; transition:transform .1s, border-color .1s; }
  .promotor-pick:hover{ border-color:var(--brand-strong); transform:translateY(-2px); }

  /* ---------- Avatars ---------- */
  .avatar{ border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-family:'Plus Jakarta Sans'; flex-shrink:0; border:2px solid var(--outline); }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:16px; scrollbar-width:none; -ms-overflow-style:none; }
  .tabs::-webkit-scrollbar{ display:none; height:0; }
  .tab-btn{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:var(--surface); border:1.5px solid var(--line); color:var(--ink-soft); padding:.55rem 1rem; border-radius:999px; font-weight:700; font-size:.88rem; cursor:pointer; }
  .tab-btn.active{ background:var(--brand-strong); border-color:var(--brand-strong); color:#fff; }

  /* ---------- Stat cards ---------- */
  .stat-card{ display:flex; flex-direction:column; gap:6px; }
  .stat-label{ font-size:.78rem; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-faint); }
  .stat-value{ font-family:'Plus Jakarta Sans'; font-size:1.7rem; font-weight:800; }
  .stat-delta{ font-size:.82rem; font-weight:700; }
  .delta-up{ color:var(--success); } .delta-down{ color:var(--danger); }

  .progress{ background:var(--surface-2); border:1.5px solid var(--line); border-radius:999px; height:12px; overflow:hidden; }
  .progress-fill{ background:linear-gradient(90deg, var(--brand-strong), var(--brand)); height:100%; border-radius:999px 0 0 999px; width:0; transition:width 1s cubic-bezier(.16,.8,.3,1); }

  /* ---------- Leaderboard ---------- */
  .leader-card{ background:linear-gradient(135deg, var(--gold-wash), var(--surface)); border:2.5px solid var(--gold); box-shadow:4px 4px 0 var(--gold-strong); border-radius:16px; padding:16px; display:flex; align-items:center; gap:14px; transform:rotate(-.6deg); margin-bottom:14px; position:relative; overflow:hidden; }
  .leader-card::after{
    content:""; position:absolute; top:0; left:-70%; width:35%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
    transform:skewX(-20deg); animation:shimmer 4s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .leader-card::after{ animation:none; display:none; } }
  .leader-card .medal-icon{ flex-shrink:0; animation:floaty 2.6s ease-in-out infinite; }
  .leader-tag{ background:var(--gold); color:#241a00; font-weight:800; font-size:.72rem; padding:2px 9px; border-radius:999px; display:inline-block; margin-top:2px; }
  .rank-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; border:1.5px solid transparent; }
  .rank-row + .rank-row{ margin-top:4px; }
  .rank-row.me{ border-color:var(--brand-strong); background:var(--brand-wash); }
  .rank-pos{ width:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--ink-faint); }
  .rank-name{ font-weight:700; flex:1; }
  .rank-total{ font-weight:800; }
  .you-tag{ font-size:.7rem; background:var(--brand-strong); color:#fff; padding:1px 7px; border-radius:999px; margin-left:6px; font-weight:700; }

  /* ---------- Forms ---------- */
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:.8rem; font-weight:700; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:.6rem .7rem; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--brand-strong); outline-offset:1px; border-color:var(--brand-strong); }
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }

  /* ---------- Tables ---------- */
  .table-wrap{ overflow-x:auto; border:1.5px solid var(--line); border-radius:12px; }
  table{ width:100%; border-collapse:collapse; min-width:520px; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:.88rem; white-space:nowrap; }
  th{ background:var(--surface-2); font-size:.74rem; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); }
  tr:last-child td{ border-bottom:none; }
  td.wrap-cell{ white-space:normal; }

  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:800; }
  .pill-on{ background:var(--success-wash); color:var(--success); }
  .pill-off{ background:var(--surface-2); color:var(--ink-faint); }

  .promotor-card{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:12px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface); }
  .promotor-card-head{ display:flex; align-items:center; gap:12px; min-width:0; flex:1 1 220px; }
  .promotor-info{ flex:1; min-width:0; }
  .promotor-card.inactive{ opacity:.55; }

  /* ---------- Bars ---------- */
  .bar-row{ display:grid; grid-template-columns:100px 1fr 90px; gap:10px; align-items:center; margin-bottom:8px; }
  .bar-track{ background:var(--surface-2); border-radius:8px; height:16px; overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--brand-strong), var(--brand)); border-radius:8px 0 0 8px; width:0; transition:width 1.1s cubic-bezier(.16,.8,.3,1); }

  /* ---------- Toast ---------- */
  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:.7rem 1.1rem; border-radius:10px; font-weight:700; font-size:.86rem; box-shadow:0 6px 18px rgba(0,0,0,.25); z-index:50; max-width:90vw; text-align:center; }

  .chip{ background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:.76rem; font-weight:700; color:var(--ink-soft); }

  .section-title{ font-size:1.05rem; font-weight:800; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
  .loading-wrap{ min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .spin{ width:40px; height:40px; border-radius:50%; border:4px solid var(--line); border-top-color:var(--brand-strong); animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- Icons (hand-drawn vector set, matches the mascot's stroke) ---------- */
  .icon{ display:inline-flex; vertical-align:-0.15em; flex-shrink:0; }
  .icon svg{ display:block; }
  .tab-icon{ margin-right:2px; }
  .medal-1 circle.medal-face{ fill:var(--gold); } .medal-1 .medal-ribbon{ stroke:var(--gold-strong); }
  .medal-2 circle.medal-face{ fill:#C7D0DE; } .medal-2 .medal-ribbon{ stroke:#8B95A8; }
  .medal-3 circle.medal-face{ fill:#E3A272; } .medal-3 .medal-ribbon{ stroke:#B06B3D; }

  /* ---------- Motion: floating mascot + ambient shader-style background ---------- */
  @keyframes shimmer{ 0%{ left:-60%; } 45%{ left:120%; } 100%{ left:120%; } }
  @keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-6px) rotate(-3deg); } }
  @keyframes floatyBig{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-14px) rotate(2deg); } }
  @keyframes glowPulse{ 0%,100%{ opacity:.55; transform:scale(1); } 50%{ opacity:.9; transform:scale(1.08); } }
  @keyframes poke{ 0%{ transform:rotate(0deg) scale(1); } 25%{ transform:rotate(-14deg) scale(1.08); } 50%{ transform:rotate(10deg) scale(1.1); } 75%{ transform:rotate(-6deg) scale(1.04); } 100%{ transform:rotate(0deg) scale(1); } }
  @keyframes bubbleIn{ from{ opacity:0; transform:translateY(6px) scale(.9); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes denyShake{
    0%,100%{ transform:translateX(0) rotate(0deg); }
    12%{ transform:translateX(-9px) rotate(-10deg); } 24%{ transform:translateX(8px) rotate(9deg); }
    36%{ transform:translateX(-7px) rotate(-8deg); } 48%{ transform:translateX(6px) rotate(7deg); }
    60%{ transform:translateX(-4px) rotate(-5deg); } 72%{ transform:translateX(3px) rotate(3deg); }
    84%{ transform:translateX(-2px) rotate(-2deg); }
  }
  .mascot-deny, .hero-mascot.mascot-deny, .mascot-fab img.mascot-deny{ animation:denyShake .65s cubic-bezier(.36,.07,.19,.97) both !important; }
  @media (prefers-reduced-motion: reduce){ .mascot-deny{ animation:none !important; } }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(12px) scale(.985); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes ambientDrift{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  .page > *, .card, .promotor-card, .stat-card, .rank-row, .leader-card, .choice-card, .promotor-pick{
    animation: cardIn .5s cubic-bezier(.16,.8,.3,1) both;
  }
  .card:hover, .promotor-card:hover, .promotor-pick:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(11,18,32,.12), var(--shadow-sm); transition:transform .18s ease, box-shadow .18s ease, border-color .1s; }
  .card-sticker:hover{ transform:none; }
  @media (prefers-reduced-motion: reduce){
    .brand .badge-bg, .hero-mascot, .mascot-fab img, .mascot-glow{ animation:none !important; }
    .page > *, .card, .promotor-card, .stat-card, .rank-row, .leader-card, .choice-card, .promotor-pick{ animation:none !important; }
    .card:hover, .promotor-card:hover, .promotor-pick:hover{ transform:none; }
    .progress-fill, .bar-fill{ transition:none !important; }
  }
  .rank-row:nth-of-type(1){ animation-delay:.02s; } .rank-row:nth-of-type(2){ animation-delay:.06s; }
  .rank-row:nth-of-type(3){ animation-delay:.10s; } .rank-row:nth-of-type(4){ animation-delay:.14s; }
  .rank-row:nth-of-type(5){ animation-delay:.18s; }
  .grid-stats > *:nth-child(1){ animation-delay:.02s; } .grid-stats > *:nth-child(2){ animation-delay:.07s; }
  .grid-stats > *:nth-child(3){ animation-delay:.12s; } .grid-stats > *:nth-child(4){ animation-delay:.17s; }

  #confetti-canvas{ position:fixed; inset:0; width:100%; height:100%; z-index:60; pointer-events:none; }
  .num.counting{ font-variant-numeric: tabular-nums; }

  .hero-mascot-wrap{ position:relative; width:120px; height:120px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center; }
  .hero-mascot-wrap .mascot-glow{
    position:absolute; inset:-20px; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--logo-blue-rgb),.55), rgba(var(--logo-blue-rgb),0) 70%);
    animation:glowPulse 2.8s ease-in-out infinite;
  }
  .hero-mascot{ width:104px; height:104px; position:relative; z-index:1; animation:floatyBig 3.6s ease-in-out infinite; filter:drop-shadow(0 6px 10px rgba(11,18,32,.18)); }

  .mascot-fab{ position:fixed; right:18px; bottom:18px; z-index:40; width:58px; height:58px; cursor:pointer; }
  .mascot-fab .mascot-glow{
    position:absolute; inset:-16px; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--logo-blue-rgb),.5), rgba(var(--logo-blue-rgb),0) 70%);
    animation:glowPulse 3.2s ease-in-out infinite;
  }
  .mascot-fab-inner{ position:relative; width:58px; height:58px; border-radius:50%; background:var(--logo-blue); border:2.5px solid var(--logo-ink); box-shadow:3px 3px 0 var(--logo-ink); display:flex; align-items:center; justify-content:center; }
  .mascot-fab img{ width:38px; height:38px; animation:floaty 3.4s ease-in-out infinite; }
  .mascot-fab.poked .mascot-fab-inner{ animation:poke .6s ease; }
  .mascot-bubble{
    position:absolute; right:66px; bottom:6px; background:var(--ink); color:var(--paper);
    padding:.5rem .75rem; border-radius:10px; font-size:.78rem; font-weight:700; white-space:nowrap;
    animation:bubbleIn .18s ease-out; box-shadow:0 4px 12px rgba(0,0,0,.2);
  }
  @media (max-width:520px){
    .mascot-fab{ right:12px; bottom:12px; width:48px; height:48px; }
    .mascot-fab-inner{ width:48px; height:48px; }

  function toDocSnap(snap){
    return {
      id: snap.id,

      data: function(){ return snap.data(); }
    };
  }
  function makeDocRef(path){

      id: ref.id,
      path: path,
      get: function(){ return getDoc(ref).then(toDocSnap); },
      set: function(data){ return setDoc(ref, data); },

  function makeCollectionRef(path){
    var ref = collection(firestoreDb, path);

      path: path,

  function activePromotores(){ return state.promotores.filter(function(p){ return p.activo !== false; }); }

  function totalForPromotorMonth(promotorId, monthKey){
    var t = 0;
    state.ventas.forEach(function(v){ if(v.promotorId===promotorId && monthKeyOf(v.fecha)===monthKey) t += Number(v.monto)||0; });
    return t;

  function metaCumplida(p, monthKey){

  function buildFelicitacionMailto(p, total, meta){

    return "mailto:" + encodeURIComponent(p.email || "") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  function computeRanking(monthKey, opts){
    opts = opts || {};
    var includeAllActive = opts.includeAllActive !== false;
    var totals = {}; // id -> {nombre,total,count}
    state.ventas.forEach(function(v){
      if(monthKeyOf(v.fecha) !== monthKey) return;
      var cur = totals[v.promotorId] || { nombre: v.promotorNombre || "?", total:0, count:0 };
      cur.total += Number(v.monto)||0;
      cur.count += 1;
      if(v.promotorNombre) cur.nombre = v.promotorNombre;
      totals[v.promotorId] = cur;
    });
    if(includeAllActive){
      activePromotores().forEach(function(p){
        if(!totals[p.id]) totals[p.id] = { nombre: p.nombre, total:0, count:0 };
      });
    }
    var arr = Object.keys(totals).map(function(id){
      var t = totals[id];
      return { promotorId:id, nombre:t.nombre, total:t.total, count:t.count };
    });
    arr.sort(function(a,b){
      if(b.total !== a.total) return b.total - a.total;
      return a.nombre.localeCompare(b.nombre);
    });
    return arr;
  }

  function allMonthsWithVentas(){
    var set = {};
    state.ventas.forEach(function(v){ set[monthKeyOf(v.fecha)] = true; });
    set[currentMonthKey()] = true;

  }

  function personalMonths(promotorId){
    var set = {};
    state.ventas.forEach(function(v){ if(v.promotorId===promotorId) set[monthKeyOf(v.fecha)] = true; });

  }

  function winsCount(promotorId){
    var months = {};
    state.ventas.forEach(function(v){ months[monthKeyOf(v.fecha)] = true; });
    var wins = [];
    Object.keys(months).sort().forEach(function(mk){
      var ranking = computeRanking(mk, { includeAllActive:false });
      if(ranking.length && ranking[0].total > 0 && ranking[0].promotorId === promotorId){
        wins.push(mk);
      }
    });
    return wins;
  }

  /* ---------------- motion helpers: grow bars + count-up numbers ---------------- */
  function reducedMotion(){ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }

  /* Wraps a navigation change (switching screens, tabs, identity) in a quick
     fade+settle transition instead of an instant content swap. */
  function navigate(changeFn){
    var app = document.getElementById("app");
    if(!app || reducedMotion()){ changeFn(); render(); return; }
    app.classList.add("app-leave");
    window.setTimeout(function(){
      changeFn();
      render();
      void app.offsetWidth;
      app.classList.remove("app-leave");
    }, 170);
  }

  function growBars(){
    var els = document.querySelectorAll("[data-grow]");
    if(!els.length) return;
    if(reducedMotion()){
      els.forEach(function(el){ el.style.width = el.getAttribute("data-grow"); });
      return;
    }
    els.forEach(function(el){ el.style.width = "0%"; });
    window.requestAnimationFrame(function(){
      window.requestAnimationFrame(function(){
        els.forEach(function(el){ el.style.width = el.getAttribute("data-grow"); });
      });
    });
  }

  var countCache = {};
  function formatCount(n, fmt){
    if(fmt === "money") return fmtMoney(n);
    if(fmt === "pct") return Math.round(n) + "%";
    return String(Math.round(n));
  }
  function applyCountUps(){
    var els = document.querySelectorAll("[data-countup]");
    els.forEach(function(el){
      var id = el.id;
      var target = parseFloat(el.getAttribute("data-target")) || 0;
      var fmt = el.getAttribute("data-fmt") || "int";
      var from = countCache.hasOwnProperty(id) ? countCache[id] : 0;
      countCache[id] = target;
      if(reducedMotion() || from === target){ el.textContent = formatCount(target, fmt); return; }
      var start = null;
      var duration = 700;
      function step(ts){
        if(start === null) start = ts;
        var p = Math.min(1, (ts - start) / duration);
        var eased = 1 - Math.pow(1 - p, 3);
        var val = from + (target - from) * eased;
        el.textContent = formatCount(val, fmt);
        if(p < 1) window.requestAnimationFrame(step);
        else el.textContent = formatCount(target, fmt);
      }
      window.requestAnimationFrame(step);
    });
  }

  /* ---------------- confetti burst (celebrates a bono paid / a new leader) ---------------- */
  function burstConfetti(originX, originY){
    if(reducedMotion()) return;
    var canvas = document.getElementById("confetti-canvas");
    if(!canvas) return;
    var ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    originX = originX == null ? canvas.width/2 : originX;
    originY = originY == null ? canvas.height/3 : originY;
    var colors = ["#77BAFF","#E9A227","#0B1220","#FFFFFF","#2E6FC9"];
    var particles = [];
    for(var i=0;i<70;i++){
      var angle = Math.random()*Math.PI*2;
      var speed = 3 + Math.random()*7;
      particles.push({
        x: originX, y: originY,
        vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 3,
        size: 4 + Math.random()*5,
        color: colors[i % colors.length],
        rot: Math.random()*Math.PI,
        vrot: (Math.random()-0.5)*0.3,
        life: 1
      });
    }
    var start = null;
    function frame(ts){
      if(start === null) start = ts;
      var elapsed = ts - start;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      var alive = false;
      particles.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.rot += p.vrot; p.life -= 0.012;
        if(p.life > 0){
          alive = true;
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
          ctx.restore();
        }
      });
      if(alive && elapsed < 2200) window.requestAnimationFrame(frame);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    window.requestAnimationFrame(frame);
  }

    var mk = currentMonthKey();

    if(isLeaderNow){
      var leaderKey = identity.id + "|" + mk;
      if(!celebratedLeaders[leaderKey]){
        celebratedLeaders[leaderKey] = true;
        burstConfetti();
        return;
      }
    }
    var p = promotorById(identity.id);
    if(p && metaCumplida(p, mk)){
      var metaKey = "meta|" + identity.id + "|" + mk;
      if(!celebratedLeaders[metaKey]){
        celebratedLeaders[metaKey] = true;
        burstConfetti();
      }
    }
  }

    var ranking = computeRanking(mk);

    var count = ranking.reduce(function(s,r){ return s+r.count; }, 0);
    var activos = activePromotores().length;
    var metaTotal = activePromotores().reduce(function(s,p){ return s+metaFor(p); }, 0);
    var pctMeta = metaTotal>0 ? (total/metaTotal*100) : 0;

    var top3 = ranking.filter(function(r){return r.total>0;}).slice(0,3);
    var topHtml = top3.length ? top3.map(function(r,i){
      return '<div class="rank-row"><span class="rank-pos">'+icon("medal",{tier:i+1,size:"1.6em"})+'</span>'+avatarHtml(r.nombre,34)+

    }).join("") : '<p class="muted small">Todavía no hay ventas cargadas este mes.</p>';

    var maxTotal = ranking.reduce(function(m,r){ return Math.max(m, r.total); }, 0) || 1;
    var barsHtml = ranking.map(function(r){
      var pct = Math.round((r.total/maxTotal)*100);
      return '<div class="bar-row">' +
        '<span class="small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+escapeHtml(r.nombre)+'">'+escapeHtml(r.nombre)+'</span>' +
        '<div class="bar-track"><div class="bar-fill" data-grow="'+pct+'%"></div></div>' +
        '<span class="small num" style="text-align:right">'+fmtMoney(r.total)+'</span>' +
        '</div>';
    }).join("");

    return '' +
      '<div class="grid grid-stats" style="margin-bottom:16px">' +
        statCard("Total del mes", fmtMoney(total), monthLabel(mk), {id:"stat-resumen-total", raw:total, fmt:"money"}) +
        statCard("Ventas cargadas", String(count), "unidades", {id:"stat-resumen-count", raw:count, fmt:"int"}) +
        statCard("Promotores activos", String(activos), "en el equipo") +
        '<div class="card stat-card"><div class="stat-label">Meta del equipo</div>' + progressBarHtml(pctMeta) +

      '</div>' +
      '<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px" class="grid-resumen">' +
        '<div class="card"><h3 class="section-title">'+icon("trophy",{size:"1.2em"})+' Top del mes</h3>'+topHtml+'</div>' +
        '<div class="card"><h3 class="section-title">Ventas por promotor</h3>'+(barsHtml||'<p class="muted small">Sin datos todavía.</p>')+'</div>' +
      '</div>';

  function statCard(label, value, sub, opts){
    opts = opts || {};
    var valueAttrs = "";
    if(opts.id != null && opts.raw != null){
      valueAttrs = ' data-countup data-target="'+opts.raw+'" data-fmt="'+(opts.fmt||"int")+'" id="'+opts.id+'"';
    }
    return '<div class="card stat-card"><div class="stat-label">'+escapeHtml(label)+'</div>' +
      '<div class="stat-value num"'+valueAttrs+'>'+value+'</div>' +
      '<div class="small muted">'+escapeHtml(sub||"")+'</div></div>';
  }

        '</div>' +
        '<div class="field" style="margin-bottom:14px"><label>Comentario (opcional)</label><input type="text" name="comentario" value="'+(editing?escapeHtml(editing.comentario||''):'')+'" placeholder="Notas de la venta"></div>' +

          '<button class="ghost-btn btn-sm" style="color:var(--danger)" onclick="NODO.deleteVenta(\''+v.id+'\')">'+icon("trash",{size:".95em"})+' Borrar</button></td></tr>';

  function renderRankingTab(isAdmin){
    var months = allMonthsWithVentas();
    var monthSelect = '<select onchange="NODO.setRankingMonth(this.value)">' + months.map(function(mk){
      return '<option value="'+mk+'" '+(mk===ui.rankingMonth?'selected':'')+'>'+monthLabel(mk)+'</option>';
    }).join("") + '</select>';

    var ranking = computeRanking(ui.rankingMonth);
    var leader = ranking.length && ranking[0].total>0 ? ranking[0] : null;
    var rest = leader ? ranking.slice(1) : ranking;

    var leaderHtml = leader ? (
      '<div class="leader-card"><span class="medal-icon">'+icon("trophy",{size:"2.2rem"})+'</span>' + avatarHtml(leader.nombre, 54) +
      '<div><div style="font-weight:800;font-size:1.05rem">'+escapeHtml(leader.nombre)+'</div>' +
      '<div class="num" id="stat-leader-total" data-countup data-target="'+leader.total+'" data-fmt="money" style="font-family:\'Plus Jakarta Sans\';font-weight:800;font-size:1.3rem">'+fmtMoney(leader.total)+'</div>' +
      '<span class="leader-tag">'+icon("trophy",{size:"1em"})+' Líder del mes — gana el bono</span></div></div>'
    ) : '<p class="muted small">Todavía no hay ventas cargadas ese mes.</p>';

    var restHtml = rest.map(function(r, idx){
      var pos = leader ? idx+2 : idx+1;
      return '<div class="rank-row"><span class="rank-pos">'+pos+'</span>' + avatarHtml(r.nombre,34) +
        '<span class="rank-name">'+escapeHtml(r.nombre)+'</span><span class="rank-total num">'+fmtMoney(r.total)+'</span></div>';
    }).join("");

    var bonoBtn = "";

      var bono = bonoFor(ui.rankingMonth);
      var pagado = bono && bono.pagado && bono.promotorId===leader.promotorId;
      bonoBtn = '<button class="btn btn-sm '+(pagado?'btn-line':'btn-gold')+'" onclick="NODO.toggleBonoPagado(\''+ui.rankingMonth+'\', event)">'+(pagado?icon("check",{size:"1em"})+' Bono pagado — marcar como no pagado':'Marcar bono como pagado')+'</button>';
    }

    return '' +
      '<div class="card">' +
        '<div class="row between wrap" style="margin-bottom:14px"><h3 class="section-title" style="margin:0">'+icon("trophy",{size:"1.1em"})+' Ranking — '+monthLabel(ui.rankingMonth)+'</h3>'+monthSelect+'</div>' +
        leaderHtml +
        (bonoBtn ? '<div style="margin-bottom:14px">'+bonoBtn+'</div>' : '') +
        restHtml +
      '</div>';

  function renderHistorialTab(){
    var months = allMonthsWithVentas().filter(function(mk){
      var r = computeRanking(mk, {includeAllActive:false});
      return r.length && r[0].total>0;
    });
    if(!months.length) return '<div class="card"><p class="muted small">Todavía no hay meses con ventas cerradas.</p></div>';

    var rowsHtml = months.map(function(mk){
      var ranking = computeRanking(mk, {includeAllActive:false});
      var winner = ranking[0];
      var bono = bonoFor(mk);
      var pagado = bono && bono.pagado && bono.promotorId===winner.promotorId;
      var isCurrent = mk === currentMonthKey();
      return '<tr>' +
        '<td>'+monthLabel(mk)+(isCurrent?' <span class="chip">en curso</span>':'')+'</td>' +
        '<td class="row" style="gap:8px">'+avatarHtml(winner.nombre,28)+escapeHtml(winner.nombre)+'</td>' +
        '<td class="num">'+fmtMoney(winner.total)+'</td>' +
        '<td>'+(pagado ? '<span class="pill pill-on">Pagado</span>' : '<span class="pill pill-off">Pendiente</span>')+'</td>' +
        '<td><button class="ghost-btn btn-sm" onclick="NODO.toggleBonoPagado(\''+mk+'\', event)">'+(pagado?'Revertir':'Marcar pagado')+'</button></td>' +
        '</tr>';
    }).join("");

    return '<div class="card"><h3 class="section-title">'+icon("clock",{size:"1.1em"})+' Historial de ganadores del mes</h3>' +
      '<div class="table-wrap"><table><thead><tr><th>Mes</th><th>Ganador</th><th>Total vendido</th><th>Bono</th><th></th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div></div>';
  }

  /* ---------------- PROMOTOR ---------------- */
  function renderPromotorShell(){
    var p = promotorById(identity.id);
    if(!p){
      return brandHeader('<button class="ghost-btn" onclick="NODO.logout()">Cambiar de usuario</button>') +
        '<div class="page"><div class="card center"><p class="muted">Tu perfil ya no está disponible. Pedile al administrador que te vuelva a agregar.</p>' +
        '<button class="btn btn-primary" style="margin-top:12px" onclick="NODO.logout()">Volver</button></div></div>';
    }
    var mk = currentMonthKey();
    var prevMk = shiftMonthKey(mk, -1);
    var ranking = computeRanking(mk);
    var myIdx = -1;
    ranking.forEach(function(r,i){ if(r.promotorId===p.id) myIdx = i; });
    var mine = myIdx>=0 ? ranking[myIdx] : {total:0,count:0};
    var isLeader = myIdx===0 && mine.total>0;

    var prevRanking = computeRanking(prevMk, {includeAllActive:false});
    var prevMine = prevRanking.filter(function(r){return r.promotorId===p.id;})[0];
    var prevTotal = prevMine ? prevMine.total : 0;
    var delta = prevTotal>0 ? ((mine.total-prevTotal)/prevTotal*100) : (mine.total>0?100:0);
    var deltaHtml = prevTotal>0 || mine.total>0
      ? '<span class="'+(delta>=0?'delta-up':'delta-down')+'">'+icon(delta>=0?"arrowUp":"arrowDown",{size:"1em"})+' '+Math.abs(Math.round(delta))+'% vs '+monthLabel(prevMk)+'</span>'
      : '<span class="muted">Sin datos del mes anterior</span>';

    var meta = metaFor(p);
    var pctMeta = meta>0 ? (mine.total/meta*100) : 0;

    var wins = winsCount(p.id);

    var greetingExtra = isLeader
      ? '<div class="leader-card" style="margin-top:14px"><span class="medal-icon">'+icon("trophy",{size:"2.1rem"})+'</span><div><div style="font-weight:800">¡Vas primero este mes!</div><div class="small muted">Seguí así para ganarte el bono</div></div></div>'
      : '';
    var cumplioMeta = metaCumplida(p, mk);
    var metaExtra = cumplioMeta
      ? '<div class="leader-card" style="margin-top:14px;border-color:var(--brand-strong);box-shadow:4px 4px 0 var(--brand-strong);background:linear-gradient(135deg, var(--brand-wash), var(--surface))">' +
          '<span class="medal-icon" style="color:var(--brand-strong)">'+icon("target",{size:"2.1rem"})+'</span>' +
          '<div><div style="font-weight:800">¡Cumpliste tu meta del mes!</div><div class="small muted">Llegaste a '+fmtMoney(mine.total)+' de '+fmtMoney(meta)+'</div></div>' +
        '</div>'
      : '';

    var statsHtml = '<div class="grid grid-stats" style="margin:16px 0">' +
      statCard("Total del mes", fmtMoney(mine.total), monthLabel(mk), {id:"stat-promo-total", raw:mine.total, fmt:"money"}) +
      statCard("Ventas realizadas", String(mine.count), "este mes", {id:"stat-promo-count", raw:mine.count, fmt:"int"}) +
      '<div class="card stat-card"><div class="stat-label">Comparación</div><div class="stat-value" style="font-size:1.1rem">'+deltaHtml+'</div><div class="small muted">Mes anterior: '+fmtMoney(prevTotal)+'</div></div>' +
      (meta>0 ? '<div class="card stat-card"><div class="stat-label">Meta del mes</div>'+progressBarHtml(pctMeta)+'<div class="small muted">'+fmtMoney(mine.total)+' de '+fmtMoney(meta)+' ('+Math.round(pctMeta)+'%)</div></div>' : '') +
      '</div>';

    var logrosHtml = '<div class="card" style="margin-bottom:16px"><h3 class="section-title">'+icon("trophy",{size:"1.1em"})+' Tus logros</h3>' +
      (wins.length
        ? '<p>Fuiste el <strong>#1 del mes</strong> '+wins.length+' '+(wins.length===1?'vez':'veces')+':</p><div class="row wrap" style="margin-top:6px">'+wins.map(function(mk2){return '<span class="chip">'+monthLabel(mk2)+'</span>';}).join("")+'</div>'
        : '<p class="muted small">Todavía no fuiste #1 del mes. ¡Este mes puede ser el tuyo!</p>') +
      '</div>';

    var rankingCard = '<div class="card" style="margin-bottom:16px"><h3 class="section-title">'+icon("trophy",{size:"1.1em"})+' Ranking del equipo — '+monthLabel(mk)+'</h3>' +
      renderRankingListReadOnly(ranking, p.id) + '</div>';

    var months = personalMonths(p.id);
    var monthSelect = '<select onchange="NODO.setPromotorHistMonth(this.value)">' + months.map(function(m2){
      return '<option value="'+m2+'" '+(m2===ui.promotorHistMonth?'selected':'')+'>'+monthLabel(m2)+'</option>';
    }).join("") + '</select>';
    var myVentas = state.ventas.filter(function(v){ return v.promotorId===p.id && monthKeyOf(v.fecha)===ui.promotorHistMonth; })
      .sort(function(a,b){ return (b.fecha||"").localeCompare(a.fecha||""); });
    var histTable = myVentas.length ? (
      '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Monto</th><th>Comentario</th></tr></thead><tbody>' +
      myVentas.map(function(v){ return '<tr><td>'+v.fecha+'</td><td>'+escapeHtml(v.producto||"—")+'</td><td class="num">'+fmtMoney(v.monto)+'</td><td class="wrap-cell">'+escapeHtml(v.comentario||"")+'</td></tr>'; }).join("") +
      '</tbody></table></div>'
    ) : '<p class="muted small">No tenés ventas cargadas ese mes.</p>';
    var histCard = '<div class="card"><div class="row between wrap" style="margin-bottom:10px"><h3 class="section-title" style="margin:0">'+icon("clock",{size:"1.1em"})+' Tu historial</h3>'+monthSelect+'</div>'+histTable+'</div>';

    return brandHeader('<button class="ghost-btn" onclick="NODO.logout()">Cambiar de usuario</button>') +
      '<div class="page">' +
      '<div class="card card-sticker row" style="gap:14px">' + avatarHtml(p.nombre, 56) +
        '<div><div class="muted small">Hola,</div><div style="font-family:\'Plus Jakarta Sans\';font-weight:800;font-size:1.3rem">'+escapeHtml(p.nombre)+' '+icon("wave",{size:"1.1em"})+'</div></div>' +
      '</div>' +
      greetingExtra +
      metaExtra +
      statsHtml +
      logrosHtml +
      rankingCard +
      histCard +
      '</div>';
  }

  function renderRankingListReadOnly(ranking, myId){
    var leader = ranking.length && ranking[0].total>0 ? ranking[0] : null;
    var rows = "";
    ranking.forEach(function(r, idx){
      var isMe = r.promotorId===myId;
      var pos = idx+1;
      var posLabel = (leader && idx===0) ? icon("trophy",{size:"1.3em"}) : String(pos);
      rows += '<div class="rank-row '+(isMe?'me':'')+'"><span class="rank-pos">'+posLabel+'</span>' + avatarHtml(r.nombre,32) +
        '<span class="rank-name">'+escapeHtml(r.nombre)+(isMe?'<span class="you-tag">Vos</span>':'')+'</span>' +
        '<span class="rank-total num">'+fmtMoney(r.total)+'</span></div>';
    });
    return rows || '<p class="muted small">Todavía no hay ventas este mes.</p>';
  }

  /* ---------------- actions (exposed as window.NODO) ---------------- */
  var NODO = {};

  NODO.chooseAdmin = function(){
    navigate(function(){
      if(state.config.adminPin){
        ui.adminPinError = null;
        ui.gateStep = "adminPin";
      } else {
        identity = {type:"admin"};
        saveIdentity();
      }
    });
  };
  NODO.submitAdminPin = function(e){
    e.preventDefault();
    var val = document.getElementById("admin-pin-input").value.trim();
    if(val && val === String(state.config.adminPin)){
      navigate(function(){
        identity = {type:"admin"};
        saveIdentity();
        ui.gateStep = "role";
        ui.adminPinError = null;
      });
    } else {
      ui.adminPinError = "PIN incorrecto. Probá de nuevo.";
      ui.adminPinShake = true;
      render();
      var input = document.getElementById("admin-pin-input");
      if(input){ input.value = ""; input.focus(); }
    }
    return false;
  };
  NODO.choosePromotorStep = function(){ navigate(function(){ ui.gateStep = "promotor"; }); };
  NODO.gateBack = function(){ navigate(function(){ ui.gateStep = "role"; ui.adminPinError = null; }); };
  NODO.choosePromotor = function(id){
    var p = promotorById(id);
    if(!p) return;
    navigate(function(){
      if(p.pin){
        ui.pendingPromotorId = id;
        ui.promotorPinError = null;
        ui.gateStep = "promotorPin";
      } else {
        identity = {type:"promotor", id:id};
        saveIdentity();
      }
    });
  };
  NODO.submitPromotorPin = function(e){
    e.preventDefault();
    var p = promotorById(ui.pendingPromotorId);
    var val = document.getElementById("promotor-pin-input").value.trim();
    if(p && val && val === String(p.pin)){
      navigate(function(){
        identity = {type:"promotor", id:p.id};
        saveIdentity();
        ui.gateStep = "role";
        ui.pendingPromotorId = null;
        ui.promotorPinError = null;
      });
    } else {
      ui.promotorPinError = "PIN incorrecto. Probá de nuevo.";
      ui.promotorPinShake = true;
      render();
      var input = document.getElementById("promotor-pin-input");
      if(input){ input.value = ""; input.focus(); }
    }
    return false;
  };
  NODO.promotorPinBack = function(){ navigate(function(){ ui.gateStep = "promotor"; ui.pendingPromotorId = null; ui.promotorPinError = null; }); };
  NODO.logout = function(){ navigate(function(){ identity = null; ui.gateStep = "role"; clearIdentity(); }); };

  NODO.setAdminTab = function(tab){ navigate(function(){ ui.adminTab = tab; }); };
  NODO.setRankingMonth = function(mk){ ui.rankingMonth = mk; render(); };
  NODO.setVentasMonth = function(mk){ ui.ventasMonth = mk; render(); };
  NODO.setPromotorHistMonth = function(mk){ ui.promotorHistMonth = mk; render(); };

  NODO.submitVenta = function(e){
    e.preventDefault();
    var f = e.target;
    var promotorId = f.promotorId.value;
    var promotor = promotorById(promotorId);
    if(!promotor){ toast("Elegí un promotor válido."); return false; }
    var fecha = f.fecha.value || todayISO();
    var monto = parseFloat(f.monto.value);
    if(!(monto >= 0)){ toast("Ingresá un monto válido."); return false; }
    var producto = (f.producto.value||"").trim();
    var comentario = (f.comentario.value||"").trim();
    var payload = { promotorId: promotorId, promotorNombre: promotor.nombre, fecha: fecha, monto: monto, producto: producto, comentario: comentario };

    (function(){
      if(!db) return;
      var p;
      if(ui.editingVentaId){
        p = db.doc("ventas/"+ui.editingVentaId).update(payload).then(function(){ toast("Venta actualizada."); });
      } else {
        payload.creadoEn = Date.now();
        p = db.collection("ventas").add(payload).then(function(){ toast("Venta cargada."); });
      }
      p.then(function(){ ui.editingVentaId = null; render(); }).catch(handleDbError);
    })();
    return false;
  };
  NODO.editVenta = function(id){ ui.editingVentaId = id; ui.adminTab = "cargar"; render(); };
  NODO.cancelEditVenta = function(){ ui.editingVentaId = null; render(); };
  NODO.deleteVenta = function(id){
    if(!window.confirm("¿Borrar esta venta? No se puede deshacer.")) return;
    if(!db) return;
    db.doc("ventas/"+id).delete().then(function(){ toast("Venta borrada."); }).catch(handleDbError);
  };

  NODO.submitPromotor = function(e){
    e.preventDefault();
    var f = e.target;
    var nombre = (f.nombre.value||"").trim();
    if(!nombre){ toast("Ingresá un nombre."); return false; }
    var email = (f.email.value||"").trim();
    var metaRaw = f.meta.value;
    var meta = metaRaw ? parseFloat(metaRaw) : null;
    var pin = (f.pin.value||"").trim();
    var payload = { nombre: nombre, email: email, meta: (meta && meta>0) ? meta : null, pin: pin || null };
    if(!db) return false;
    var p;
    if(ui.editingPromotorId){
      var existing = promotorById(ui.editingPromotorId);
      payload.activo = existing ? existing.activo !== false : true;
      p = db.doc("promotores/"+ui.editingPromotorId).update(payload).then(function(){ toast("Promotor actualizado."); });
    } else {
      payload.activo = true;
      payload.fechaIngreso = todayISO();
      p = db.collection("promotores").add(payload).then(function(){ toast("Promotor agregado."); });
    }
    p.then(function(){ ui.editingPromotorId = null; render(); }).catch(handleDbError);
    return false;
  };
  NODO.editPromotor = function(id){ ui.editingPromotorId = id; render(); window.scrollTo({top:0, behavior:"smooth"}); };
  NODO.cancelEditPromotor = function(){ ui.editingPromotorId = null; render(); };
  NODO.togglePromotorActivo = function(id){
    var p = promotorById(id);
    if(!p || !db) return;
    db.doc("promotores/"+id).update({ activo: p.activo===false }).catch(handleDbError);
  };
  NODO.deletePromotor = function(id){
    var p = promotorById(id);
    if(!p) return;
    var tieneVentas = state.ventas.some(function(v){ return v.promotorId===id; });
    var msg = tieneVentas
      ? escapeHtml(p.nombre)+" tiene ventas registradas. Se van a conservar en el historial, pero dejará de aparecer en la lista de promotores. ¿Eliminar de todas formas?"
      : "¿Eliminar a "+escapeHtml(p.nombre)+"?";
    if(!window.confirm(msg)) return;
    if(!db) return;
    db.doc("promotores/"+id).delete().then(function(){ toast("Promotor eliminado."); }).catch(handleDbError);
  };

  NODO.submitAjustes = function(e){
    e.preventDefault();
    var f = e.target;
    var moneda = (f.moneda.value||"$").trim() || "$";
    var metaDefault = parseFloat(f.metaDefault.value) || 0;
    var adminPin = (f.adminPin.value||"").trim();
    if(!db) return false;
    db.doc("config/general").set({ moneda: moneda, metaMensualDefault: metaDefault, adminPin: adminPin || null }).then(function(){ toast("Ajustes guardados."); render(); }).catch(handleDbError);
    return false;
  };

  NODO.toggleBonoPagado = function(monthKey, evt){
    var ranking = computeRanking(monthKey, {includeAllActive:false});
    var winner = ranking[0];
    if(!winner || winner.total<=0){ toast("Todavía no hay ventas ese mes."); return; }
    if(!db) return;
    var existing = bonoFor(monthKey);
    var p;
    var willPay = !(existing && existing.pagado);
    if(!willPay){
      p = db.doc("bonos/"+monthKey).update({ pagado:false });
    } else {
      p = db.doc("bonos/"+monthKey).set({ promotorId:winner.promotorId, promotorNombre:winner.nombre, monto:winner.total, pagado:true, marcadoEn:Date.now() });
    }
    p.then(function(){
      render();
      if(willPay){
        var originX, originY;
        if(evt && evt.target && evt.target.getBoundingClientRect){
          var r = evt.target.getBoundingClientRect();
          originX = r.left + r.width/2; originY = r.top + r.height/2;
        }
        burstConfetti(originX, originY);
      }
    }).catch(handleDbError);
  };

  window.NODO = NODO;

  /* ---------------- init ---------------- */
  function subscribeAll(){
    db.collection("promotores").onSnapshot(function(snap){
      state.promotores = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.ready.promotores = true;
      render();
    }, function(err){ console.error(err); state.ready.promotores = true; render(); });

    db.collection("ventas").onSnapshot(function(snap){
      state.ventas = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.ready.ventas = true;
      render();
    }, function(err){ console.error(err); state.ready.ventas = true; render(); });

    db.doc("config/general").onSnapshot(function(snap){
      state.config = snap.exists ? Object.assign({moneda:"$", metaMensualDefault:0}, snap.data()) : {moneda:"$", metaMensualDefault:0};
      state.ready.config = true;
      render();
    }, function(err){ console.error(err); state.ready.config = true; render(); });

    db.collection("bonos").onSnapshot(function(snap){
      state.bonos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      state.ready.bonos = true;
      render();
    }, function(err){ console.error(err); state.ready.bonos = true; render(); });
  }

  /* ---------------- ambient background "shader" (soft moving blobs, canvas 2D) ---------------- */
  function initBgCanvas(){
    var canvas = document.createElement("canvas");
    canvas.id = "bg-canvas";
    document.body.insertBefore(canvas, document.body.firstChild);
    var ctx = canvas.getContext("2d");
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // On touch devices (coarse pointer) or small screens, skip the continuous
    // animation loop and mouse-parallax: it costs real main-thread time on phones
    // (especially iOS Safari while scrolling) and there's no mouse to parallax
    // against anyway. We still draw the blobs once, as a static soft background.
    var isTouchish = window.matchMedia && (window.matchMedia("(pointer: coarse)").matches || window.innerWidth < 768);
    var staticBg = reduceMotion || isTouchish;
    var W, H;
    function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resize();
    window.addEventListener("resize", function(){ resize(); if(staticBg) drawFrame(); });

    var palette = [
      "rgba("+"119,186,255"+",", // logo blue
      "rgba("+"233,162,39"+",",  // gold, used sparingly
      "rgba("+"46,111,201"+","   // deeper blue
    ];
    var blobs = [];
    var count = Math.min(6, Math.max(4, Math.round((window.innerWidth*window.innerHeight)/220000)));
    for(var i=0;i<count;i++){
      blobs.push({
        x: Math.random()*W, y: Math.random()*H,
        r: 140 + Math.random()*180,
        vx: (Math.random()-0.5)*0.18,
        vy: (Math.random()-0.5)*0.18,
        c: palette[i % palette.length],
        a: 0.12 + Math.random()*0.10
      });
    }
    var parallaxX = 0, parallaxY = 0, targetX = 0, targetY = 0;
    if(!staticBg){
      window.addEventListener("pointermove", function(e){
        targetX = (e.clientX / W - 0.5) * 40;
        targetY = (e.clientY / H - 0.5) * 40;
      }, { passive:true });
    }
    function drawFrame(){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<blobs.length;i++){
        var b = blobs[i];
        var depth = 0.4 + (i % 3) * 0.3;
        var px = b.x + parallaxX*depth, py = b.y + parallaxY*depth;
        var g = ctx.createRadialGradient(px,py,0,px,py,b.r);
        g.addColorStop(0, b.c+b.a+")");
        g.addColorStop(1, b.c+"0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(px,py,b.r,0,Math.PI*2);
        ctx.fill();
      }
    }
    function step(){
      for(var i=0;i<blobs.length;i++){
        var b = blobs[i];
        b.x += b.vx; b.y += b.vy;
        if(b.x < -b.r) b.x = W+b.r; if(b.x > W+b.r) b.x = -b.r;
        if(b.y < -b.r) b.y = H+b.r; if(b.y > H+b.r) b.y = -b.r;
      }
      parallaxX += (targetX - parallaxX) * 0.04;
      parallaxY += (targetY - parallaxY) * 0.04;
      drawFrame();
      if(!staticBg) window.requestAnimationFrame(step);
    }
    if(staticBg){ drawFrame(); }
    else { window.requestAnimationFrame(step); }
  }

  /* ---------------- floating mascot buddy (persists outside #app re-renders) ---------------- */
  var MASCOT_PHRASES = [
    "¡Cada venta suma!",
    "Hoy es un buen día para vender.",
    "El primer puesto se gana de a poco.",
    "Seguí así, vas muy bien.",
    "Un cliente más, un paso más arriba."
  ];
  function initConfettiCanvas(){
    var canvas = document.createElement("canvas");
    canvas.id = "confetti-canvas";
    document.body.appendChild(canvas);
  }

  function initMascotFab(){
    var fab = document.createElement("div");
    fab.className = "mascot-fab";
    fab.setAttribute("role","button");
    fab.setAttribute("aria-label","NODO");
    fab.innerHTML = '<span class="mascot-glow"></span><div class="mascot-fab-inner"><img src="'+MASCOT_SRC+'" alt=""></div>';
    fab.addEventListener("click", function(){
      fab.classList.remove("poked"); void fab.offsetWidth; fab.classList.add("poked");
      var existing = fab.querySelector(".mascot-bubble");
      if(existing) existing.remove();
      var bubble = document.createElement("div");
      bubble.className = "mascot-bubble";
      bubble.textContent = MASCOT_PHRASES[Math.floor(Math.random()*MASCOT_PHRASES.length)];
      fab.appendChild(bubble);
      window.setTimeout(function(){ if(bubble && bubble.parentNode) bubble.remove(); }, 2600);
    });
    document.body.appendChild(fab);
    mascotFabEl = fab;
  }

  (function init(){
    identity = loadIdentity();
    render();
    initBgCanvas();
    initConfettiCanvas();
    initMascotFab();
    var dbPromise = window.__firebaseDbPromise;
    if(!dbPromise){
      db = false;
      render();
      return;
    }
    dbPromise.then(function(namespace){
      if(!namespace){ db = false; render(); return; }
      db = namespace;
      subscribeAll();
    }).catch(function(){ db = false; render(); });
  })();

})();
</script>
